# SAFETY: Home, place and floor pre-pick joint targets were read from the teach
# pendant in degrees. Product pick points are generated online from D405 + YOLO
# detection and hand-eye TF; no per-product fixed pick coordinates are used.
move_group: manipulator
end_effector_link: palm
reference_frame: base_link
fk_service: /compute_fk

velocity_scale: 0.08
acceleration_scale: 0.03
cartesian_velocity_scale: 0.05
place_descent_velocity_scale: 0.025
planning_time: 8.0
planning_attempts: 8
cartesian_step: 0.005
min_cartesian_fraction: 0.98

startup:
  moveit_attempts: 5
  retry_interval: 2.0

# Conservative virtual shelf wall measured from the middle front edge on 2026-08-09.
# Local box axes: X = shelf left-to-right, Y = shelf depth into shelf, Z = vertical.
# Measured front edge:
#   M-FL [-0.882, 0.356, 0.768], M-FR [-0.169, 0.804, 0.779]
# Computed yaw ~= 32.1 deg. Box center is shifted from the front edge 0.30 m
# toward the shelf interior, with extra width/height safety margin.
shelf_collision:
  enabled: true
  frame: base_link
  wait_timeout: 2.0
  boxes:
    - id: shelf_virtual_wall
      size: [1.00, 0.60, 0.94]
      position: [-0.685, 0.844, 0.831]
      orientation: [0.0, 0.0, 0.276, 0.961]

# Joint order must match MoveGroup.get_active_joints():
# shoulder_pan, shoulder_lift, elbow, wrist_1, wrist_2, wrist_3.
home_joint_values_deg: [-249.10, -108.70, 117.97, 175.05, -83.10, -62.13]
place_joint_values_deg: [-158.56, -65.32, 64.88, 215.55, -86.02, -62.06]

# Safe shelf-exterior waypoints read from the teach pendant. A task moves Home
# -> floor pre-pick -> visual detection -> 10 cm horizontal approach.
floor_pre_pick_joint_values_deg:
  1: [-249.59, -97.02, 146.86, 146.88, -88.57, -67.45]
  2: [-252.64, -114.55, 121.22, 178.93, -77.65, -65.39]
  3: [-249.74, -113.69, 97.79, 198.15, -82.67, -65.39]

# Product IDs are the only targets accepted by the Robot API. The floor chooses
# the shelf pre-pick pose; yolo_class selects the detector output to grasp.
products:
  apple:
    name: 苹果
    floor: 3
    yolo_class: apple
    pick_z_offset: 0.03
  red_cup:
    name: 红色杯子
    floor: 3
    yolo_class: red_cup
  xbox_charger:
    name: Xbox充电器
    floor: 3
    yolo_class: xbox_charger
  dishwashing:
    name: 洗洁精
    floor: 3
    yolo_class: dishwashing
  water560:
    name: 560ml矿泉水
    floor: 2
    yolo_class: water560
    grasp_depth_offset: 0.24
  tea:
    name: 东方树叶
    floor: 2
    yolo_class: tea
  water1500:
    name: 1.5L矿泉水
    floor: 2
    yolo_class: water1500
  dongpeng:
    name: 东鹏特饮
    floor: 2
    yolo_class: dongpeng
    grasp_depth_offset: 0.22
  milk:
    name: 牛奶
    floor: 2
    yolo_class: milk
  yanmai:
    name: 燕麦
    floor: 1
    yolo_class: yanmai
    grasp_depth_offset: 0.16
    post_retreat_lift: 0.40

vision:
  enabled: true
  # Paths are relative to Robot/ unless an absolute path is supplied.
  model_path: vision/model/best.pt
  handeye_file: config/handeye.yaml
  base_frame: base_link
  camera_frame: camera_color_optical_frame
  image_topic: /camera/color/image_raw
  depth_topic: /camera/aligned_depth_to_color/image_raw
  camera_info_topic: /camera/color/camera_info
  confidence_threshold: 0.3
  iou_threshold: 0.50
  image_timeout: 5.0
  tf_timeout: 2.0
  min_depth_m: 0.05
  max_depth_m: 1.20
  center_roi_scale: 0.27
  pick_z_offset: 0.015
  debug_save_images: false
  debug_image_format: png
  debug_dir: /tmp/roboshelf_vision_debug

motion:
  # Local tool axis pointing from the shelf exterior toward the object. The
  # controller rotates it with the FK quaternion and projects it horizontally.
  # Negative palm/tool Y points from the shelf exterior toward the object.
  # If the gripper pushes objects inward during approach, invert this vector.
  approach_axis_local: [0.0, 1.0, 0.0]
  pick_approach_distance: 0.20
  grasp_depth_offset: 0.25
  post_grasp_lift: 0.02
  shelf_retreat_distance: 0.40
  place_clearance: 0.20

gripper:
  type: robotiq_3f_topic
  command_topic: /Robotiq3FGripperRobotOutput
  status_topic: /Robotiq3FGripperRobotInput
  mode: 1
  open_position: 0
  close_position: 255
  speed: 100
  force: 240
  feedback_timeout: 15.0
  activation_timeout: 10.0
  command_timeout: 6.0
  closing_timeout: 8.0
  opening_timeout: 8.0
  resend_period: 0.25
  position_tolerance: 5
  open_position_threshold: 30
  require_object_contact: true
